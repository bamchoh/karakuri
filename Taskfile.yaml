version: "3"

tasks:
  dev:
    desc: 開発モードで起動する（画面はホットリロード。Go 側を変更したら起動し直す）
    cmds:
      - wails dev

  build:
    desc: プロダクションビルド（build/bin に exe を作る）
    cmds:
      - wails build

  test:
    desc: 全テストを実行する（Go のテストと、画面の単体テスト）
    cmds:
      - go test ./...
      - task: test-frontend

  test-frontend:
    desc: 画面の単体テスト（Vitest）を実行する。開発サーバーは要らない
    dir: frontend
    cmds:
      - npm test

  e2e:
    desc: 画面の確認用テスト（Playwright）を実行する。先に task dev で開発サーバーを起動しておく
    dir: frontend
    cmds:
      - npx playwright test {{.CLI_ARGS}}

  clean:
    desc: ビルド成果物を削除する
    cmds:
      - rm -rf build/bin
